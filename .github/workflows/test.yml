name: Run Tests

on:
  push:
    branches: [ main, plod ]
  pull_request:
    branches: [ main, plod ]

jobs:
  test_job:
    name: Root lint + tests (kgraph, kgbundle, kgschema, kgserver)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run lint script
        run: ./lint.sh

  package_tests:
    # Packages the root lint.sh does not cover. Each has its own pyproject,
    # lockfile and testpaths, so each is synced and run from its own directory.
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [medlit, sherlock, identity-server]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: uv sync --extra dev

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: uv run pytest -q
